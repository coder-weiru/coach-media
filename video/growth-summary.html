<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mock.coach — today's growth</title>
<style>
  /* ── mock.coach brand tokens ─────────────────────────────────────────── */
  :root{
    --bg:#0f1116; --border:#2a2e3a;
    --text:#c7ccd6; --text-dim:#8a90a0; --text-strong:#f2f4f8;
    --violet:#8b5cf6; --blue:#4f74ff; --accent:#6d8cff; --gold:#ffe08a;
    --green:#4ade80;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden}
  body{font-family:-apple-system,'Inter','Segoe UI',system-ui,sans-serif}

  .stage{
    position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;cursor:pointer;
    background:radial-gradient(120% 120% at 50% 40%, #14172130 0%, var(--bg) 60%, #090a0e 100%);
    overflow:hidden;
  }
  .glow{
    position:absolute;left:50%;top:44%;width:1400px;height:1400px;translate:-50% -50%;
    background:radial-gradient(circle,
      color-mix(in srgb,var(--green) 16%,transparent) 0%,
      color-mix(in srgb,var(--blue) 12%,transparent) 36%, transparent 62%);
    opacity:0;filter:blur(6px);
  }
  .run .glow{animation:bloom 2s ease-out both, breathe 7s 2s ease-in-out infinite}
  @keyframes bloom{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
  @keyframes breathe{0%,100%{opacity:.85;scale:1}50%{opacity:1;scale:1.05}}

  .wrap{position:absolute;left:50%;top:50%;translate:-50% -50%;width:1400px;text-align:left}

  .eyebrow{
    color:var(--accent);font-size:28px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;
    opacity:0;margin-bottom:14px;
  }
  .run .eyebrow{animation:fadeUp .9s .5s cubic-bezier(.2,.7,.2,1) both}

  h1{
    font-size:76px;font-weight:800;line-height:1.05;letter-spacing:-.02em;color:var(--text-strong);
    opacity:0;margin-bottom:52px;
  }
  h1 .accent{background:linear-gradient(90deg,var(--violet),var(--blue));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .run h1{animation:fadeUp 1s .8s cubic-bezier(.2,.7,.2,1) both}

  ul{list-style:none;display:flex;flex-direction:column;gap:26px}
  li{
    display:flex;align-items:center;gap:24px;font-size:40px;font-weight:500;color:var(--text-strong);
    opacity:0;translate:0 26px;
  }
  .run li{animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(1.5s + var(--i)*.32s)}
  @keyframes rise{to{opacity:1;translate:0 0}}

  .check{
    flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
    background:color-mix(in srgb,var(--green) 20%, transparent);
    border:1.5px solid color-mix(in srgb,var(--green) 55%, transparent);
    color:var(--green);font-size:30px;font-weight:700;
    box-shadow:0 0 22px color-mix(in srgb,var(--green) 30%, transparent);
  }
  li .pct{background:linear-gradient(90deg,var(--green),var(--blue));
    -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}

  .brand{
    position:absolute;left:50%;bottom:64px;translate:-50% 0;display:flex;align-items:center;gap:14px;opacity:0;
  }
  .brand svg{width:44px;height:44px;filter:drop-shadow(0 4px 14px #4f74ff55)}
  .brand .word{font-size:30px;font-weight:700;color:var(--text-strong)}
  .brand .word .dot{background:linear-gradient(90deg,var(--violet),var(--blue));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .run .brand{animation:fadeUp 1s 3.6s cubic-bezier(.2,.7,.2,1) both}

  @keyframes fadeUp{from{opacity:0;translate:-50% 20px}to{opacity:1;translate:-50% 0}}
  /* h1 & eyebrow are not centered-translated, so give them a plain fade variant */
  .wrap .eyebrow, .wrap h1{--none:0}
  @keyframes fadeUpL{from{opacity:0;translate:0 20px}to{opacity:1;translate:0 0}}
  .run .eyebrow{animation:fadeUpL .9s .5s cubic-bezier(.2,.7,.2,1) both}
  .run h1{animation:fadeUpL 1s .8s cubic-bezier(.2,.7,.2,1) both}

  .hint{position:absolute;left:50%;bottom:20px;translate:-50% 0;opacity:0;color:var(--text-dim);font-size:18px;pointer-events:none}
  .run .hint{animation:hintIn .8s 5s ease both}
  @keyframes hintIn{to{opacity:.5}}

  @media (prefers-reduced-motion: reduce){ .run *{animation-duration:.01ms!important} }
</style>
</head>
<body>
  <div class="stage" id="stage" title="click to replay">
    <div class="glow"></div>
    <div class="wrap">
      <div class="eyebrow">AFTER TODAY'S SESSION</div>
      <h1>Your biggest <span class="accent">growth</span> today</h1>
      <ul id="list"></ul>
    </div>

    <div class="brand">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-label="mock.coach">
        <defs><linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
          <stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#4f74ff"/></linearGradient></defs>
        <rect width="32" height="32" rx="8.5" fill="url(#g)"/>
        <rect x="5" y="9.5" width="18.5" height="12.5" rx="3.4" fill="#fff"/>
        <path d="M9.8 21.4h4.4l-3.7 3.2a.5.5 0 0 1-.8-.38z" fill="#fff"/>
        <circle cx="9.8" cy="15.7" r="1.25" fill="#8b5cf6"/><circle cx="14.2" cy="15.7" r="1.25" fill="#8b5cf6"/>
        <circle cx="18.6" cy="15.7" r="1.25" fill="#8b5cf6"/>
        <path d="M25.6 5.2l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z" fill="#ffe08a"/>
      </svg>
      <span class="word">mock<span class="dot">.coach</span></span>
    </div>

    <div class="hint">click to replay</div>
  </div>

<script>
  // Translated from the original Chinese growth summary (faked — not a real product screen).
  const ITEMS = [
    'System Design — up <span class="pct">18%</span> from last time',
    'Clearer answer structure',
    'More trade-off thinking',
    'A more natural speaking pace',
    '<span class="pct">4 fewer</span> repeated phrases than last time',
  ];
  const list = document.getElementById('list');
  const stage = document.getElementById('stage');
  ITEMS.forEach((html, i) => {
    const li = document.createElement('li');
    li.style.setProperty('--i', i);
    li.innerHTML = `<span class="check">✓</span><span>${html}</span>`;
    list.appendChild(li);
  });

  function fit(){
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  function play(){ stage.classList.remove('run'); void stage.offsetWidth; stage.classList.add('run'); }
  stage.addEventListener('click', play);
  play();
</script>
</body>
</html>
